# Configuration Alembic — CarbonLedger AI
#
# L'URL de la base n'est pas définie ici : elle est lue depuis la configuration
# de l'application (variable d'environnement CARBONLEDGER_DATABASE_URL ou .env)
# par alembic/env.py. Cela évite de dupliquer les identifiants.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Comparaison des types lors de l'autogénération (utile pour PostgreSQL).
compare_type = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

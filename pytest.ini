[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
# L'avertissement httpx/starlette.testclient vient de la pile de test, pas de l'application.
filterwarnings =
    ignore::DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
# Dossier de travail des tests (base SQLite isolée). Utile si le dossier temporaire
# par défaut est sur un disque plein ou restreint :
#   CARBONLEDGER_TEST_DIR=D:\CarbonLedger\tmp\tests
